<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>404 — CalAI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090a">
  <link rel="icon" href="/CalAI/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #08090a;
      --text: #f3f2ec;
      --muted: #93958f;
      --line: #232726;
      --accent: #c6f24e;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 560px);
    }

    a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    .brand svg { width: 24px; height: 24px; }

    .code {
      margin: 0 0 8px;
      font-family: var(--mono);
      font-size: clamp(72px, 20vw, 140px);
      line-height: 0.85;
      letter-spacing: -0.06em;
      color: transparent;
      -webkit-text-stroke: 1px #343a37;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    p {
      max-width: 42ch;
      margin: 14px 0 28px;
      color: var(--muted);
      font-size: 15px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 12px 18px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      background: var(--accent);
      color: #08090a;
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .foot {
      margin-top: 48px;
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/CalAI/" aria-label="CalAI home">
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="12" fill="none" stroke="#c6f24e" stroke-width="3" stroke-linecap="round" stroke-dasharray="58 18" transform="rotate(-90 16 16)"/>
        <circle cx="16" cy="16" r="3" fill="#c6f24e"/>
      </svg>
      <span>CalAI</span>
    </a>

    <p class="code" aria-hidden="true">404</p>
    <h1>This page isn&rsquo;t on the menu.</h1>
    <p>
      The link is broken, or the page hasn&rsquo;t been built yet. CalAI is still in
      development, so that second one is fairly likely.
    </p>
    <a class="btn" href="/CalAI/">Back to CalAI <span aria-hidden="true">→</span></a>

    <p class="foot">CalAI · Hosted on GitHub Pages</p>
  </main>
</body>
</html>
