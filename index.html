<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090a" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="CalAI is a fast, mobile-first calorie tracker that works offline."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CalAI" />
    <link rel="icon" href="/CalAI/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/CalAI/icons/apple-touch-icon.png" />
    <title>CalAI — Calorie tracker</title>
    <script>
      (function () {
        var resolved = 'dark';
        try {
          var stored = localStorage.getItem('calai-theme');
          if (stored === 'light' || stored === 'dark') {
            resolved = stored;
          } else {
            resolved = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
        } catch (e) {}
        document.documentElement.dataset.theme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolved === 'light' ? '#f4f2ec' : '#08090a');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
